# Example using GPIO9, replace with your actual pin
esphome:
  name: olddoorbell
  friendly_name: "Old Doorbell"

esp32:
    board: esp32-c3-devkitm-1
    framework:
      type: esp-idf

# GPIO8 as output
output:
  - platform: gpio
    pin:
      number: GPIO8
      inverted: true   # remove if your output is active-HIGH
    id: gpio8_out


# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  port: 6053
  batch_delay: 50ms  # Reduce latency for real-time applications
  homeassistant_services: true
#  encryption:
#    # Change Key to any random string
#    key: "8mMJ0wMukNUw35wPtpG+Z23Chq7x5bQbrlRbe3PgQTE="

ota:
  - platform: esphome
    password: "e109606b539a0c208adda5d969d3b148"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    # Set this to the IP of the ESP
    static_ip: 192.168.1.18
#    # Set this to the IP address of the router. Often ends with .1
    gateway: 192.168.1.254
#    # The subnet of the network. 255.255.255.0 works for most home networks.
    subnet: 255.255.0.0
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Doorbell Fallback Hotspot"
    password: !secret wifi_password

#mqtt:
#  broker: !secret mqtt_broker
#  username: !secret mqtt_user
#  password: !secret mqtt_password

# Define the input for the momentary switch
binary_sensor:
  - platform: gpio
    id: doorbell
    pin:
      number: GPIO4  # Replace with the GPIO pin you used (e.g., 9)
      # input: true
      # pullup: true# Optional with external resistor, but good practice
      inverted: true     # The pin is LOW when pressed, so we invert it.
      # filters:
        # - delayed_on: 20ms
        # - delayed_off: 20ms
    name: "Doorbell"
    icon: "mdi:gate"
#    device_class: momentary

    # Action to take when the button is pressed
#    # change this to?
#    on_turn_on:
#    - delay: 500ms
#    - switch.turn_off: relay
    on_press:
      - output.turn_on: gpio8_out
      # - homeassistant.event:
          # event: doorbell_pressed
      - homeassistant.service:
          service: alert.create  # Or persistent_notification.create
          data:
            title: "🔔 ESP Button Alert"
            message: "The Alert Button was just pressed!"
            # entity_id: alert.my_custom_alert  # Use this if you have a defined alert
    on_release:
          - output.turn_off: gpio8_out