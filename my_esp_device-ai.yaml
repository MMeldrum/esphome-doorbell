# ==============================
# ESPHome node configuration
# ==============================

esphome:
  name: olddoorbell
  friendly_name: "Old Doorbell"

# ==============================
# ESP32 platform configuration
# ==============================

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

# ==============================
# GPIO output (onboard LED)
# ==============================

output:
  - platform: gpio
    pin:
      number: GPIO8                 # Onboard LED GPIO
      inverted: true                # Active-LOW LED
    id: gpio8_out

# ==============================
# Logging
# ==============================

logger:
  level: INFO                      # Use INFO once stable

# ==============================
# Home Assistant API
# ==============================

api:
  port: 6053
  batch_delay: 50ms                 # Low-latency event delivery
  homeassistant_services: true

# ==============================
# OTA updates
# ==============================

ota:
  - platform: esphome
    password: "e109606b539a0c208adda5d969d3b148"

# ==============================
# Wi-Fi configuration
# ==============================

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

  manual_ip:
    static_ip: 192.168.1.18
    gateway: 192.168.1.1
    subnet: 255.255.0.0

  ap:
    ssid: "Doorbell Fallback Hotspot"
    password: !secret wifi_password

# ==============================
# Doorbell button input
# ==============================

binary_sensor:
  - platform: gpio
    id: doorbell
    name: "Doorbell"
    # device_class: doorbell
    icon: "mdi:gate"

    pin:
      number: GPIO4                 # Doorbell button GPIO
      mode:
        input: true
        pullup: true                # Internal pull-up
      inverted: true                # Active-LOW button

    filters:
      - delayed_on_off: 100ms        # Debounce

    on_press:
      - output.turn_on: gpio8_out   # LED on while pressed
      - homeassistant.event:
          event: esphome.doorbell_pressed   # Stateless HA event

    on_release:
      - output.turn_off: gpio8_out  # LED off when released
